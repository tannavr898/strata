[pytest]
testpaths = tests
pythonpath = src
addopts = -q --strict-markers
filterwarnings =
    # joblib unpickles our fitted forests by setting .shape directly, which NumPy
    # 2.5 deprecates. It comes from inside joblib, not from Strata, and loading the
    # models emits it ~100k times. Silenced so a real warning stays visible.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
